<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ann Kimotho | Portfolio</title>
<style>
:root{--bg:#0a111c;--panel:#101b2b;--ink:#e6edf5;--mute:#8fa3b8;--cyan:#38d6e0;--amber:#f2b84b;--line:#1f3047;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;background-attachment:fixed}
main{max-width:740px;margin:0 auto;padding:36px 20px 56px}
h1,h2,h3{font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;line-height:1.25;margin:0}
.term{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line)}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.body{padding:20px 20px 24px;font-family:Menlo,Consolas,"Liberation Mono",monospace}
.prompt{color:var(--cyan);font-size:.95rem;margin:0 0 6px}
h1{font-size:clamp(2rem,8.5vw,3.2rem);color:var(--ink);margin:4px 0 10px}
.role{color:var(--mute);margin:0;font-size:1rem;max-width:36em;font-family:system-ui,-apple-system,sans-serif}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--cyan);vertical-align:-2px;animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
section{margin-top:44px}
h2{font-size:1.25rem;color:var(--cyan);margin-bottom:14px}
h2::before{content:"> ";color:var(--amber)}
.item{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.item h3{font-size:1rem;color:var(--ink)}
.item p,.item ul{margin:6px 0 0;color:var(--mute)}
.item ul{padding-left:18px}
.path{list-style:none;margin:0;padding:0}
.path li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:baseline}
.path b{font-family:Menlo,Consolas,monospace;color:var(--amber)}
.path li.now{border-color:var(--cyan)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:.9rem;font-family:Menlo,Consolas,monospace}
footer{margin-top:56px;color:var(--mute);font-size:.85rem;font-family:Menlo,Consolas,monospace}
</style>
</head>
<body>
<main>
<header class="term">
<div class="bar" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="body">
<p class="prompt">$ whoami</p>
<h1>Ann Kimotho</h1>
<p class="role">Juni
